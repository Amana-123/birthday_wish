<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Afzan Aslam 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#030816;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,rgba(0,115,255,.18),transparent 70%);
    top:-150px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:radial-gradient(circle,rgba(130,60,255,.13),transparent 70%);
    bottom:-150px;
    left:-150px;
    z-index:-1;
}

.particles span{
    position:fixed;
    width:8px;
    height:8px;
    background:#37aaff;
    border-radius:50%;
    opacity:.6;
    animation:float 7s linear infinite;
    z-index:-1;
}

.particles span:nth-child(1){left:8%;top:90%;animation-delay:0s;}
.particles span:nth-child(2){left:20%;top:70%;animation-delay:2s;}
.particles span:nth-child(3){left:80%;top:80%;animation-delay:1s;}
.particles span:nth-child(4){left:90%;top:40%;animation-delay:3s;}
.particles span:nth-child(5){left:55%;top:95%;animation-delay:4s;}
.particles span:nth-child(6){left:40%;top:30%;animation-delay:2s;}

@keyframes float{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    20%{opacity:.8;}
    100%{transform:translateY(-700px) rotate(360deg);opacity:0;}
}

#startScreen{
    min-height:100vh;

    justify-content:center;
    align-items:center;
    padding:30px;
}

.hero{
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:40px;
}

.hero-text{width:50%;}
.small{color:#9ccfff;letter-spacing:3px;font-size:15px;}
.hero h1{font-size:50px;line-height:1.2;margin:20px 0;}
.blue{color:#4eb6ff;}
.hero-text p{color:#b8c4d6;font-size:18px;line-height:1.8;}

.open-btn{
    margin-top:30px;
    padding:18px 35px;
    border:none;
    border-radius:12px;
    color:white;
    background:linear-gradient(90deg,#1479ff,#6d3cff);
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 30px rgba(51,132,255,.7);
    animation:pulse 2s infinite;
}

@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
