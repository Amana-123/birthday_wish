<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Afzan Aslam 🎂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:Arial,sans-serif;background:#030816;color:white;overflow-x:hidden;}
body::before{content:"";position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(0,115,255,.18),transparent 70%);top:-150px;right:-150px;z-index:-1;}
body::after{content:"";position:fixed;width:450px;height:450px;background:radial-gradient(circle,rgba(130,60,255,.13),transparent 70%);bottom:-150px;left:-150px;z-index:-1;}
.particles span{position:fixed;width:8px;height:8px;background:#37aaff;border-radius:50%;opacity:.6;animation:float 7s linear infinite;z-index:-1;}
.particles span:nth-child(1){left:8%;top:90%;animation-delay:0s;}
.particles span:nth-child(2){left:20%;top:70%;animation-delay:2s;}
.particles span:nth-child(3){left:80%;top:80%;animation-delay:1s;}
.particles span:nth-child(4){left:90%;top:40%;animation-delay:3s;}
.particles span:nth-child(5){left:55%;top:95%;animation-delay:4s;}
.particles span:nth-child(6){left:40%;top:30%;animation-delay:2s;}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:0;}20%{opacity:.8;}100%{transform:translateY(-700px) rotate(360deg);opacity:0;}}
#startScreen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px;}
.hero{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:40px;}
.hero-text{width:50%;}
.small{color:#9ccfff;letter-spacing:3px;font-size:15px;}
.hero h1{font-size:50px;line-height:1.2;margin:20px 0;}
.blue{color:#4eb6ff;}
.hero-text p{color:#b8c4d6;font-size:18px;line-height:1.8;}
.open-btn{margin-top:30px;padding:18px 35px;border:none;border-radius:12px;color:white;background:linear-gradient(90deg,#1479ff,#6d3cff);font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 0 30px rgba(51,132,255,.7);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.photo-box{width:430px;height:430px;border-radius:50%;padding:7px;background:linear-gradient(135deg,#2ba9ff,#8e4dff,#2ba9ff);box-shadow:0 0 50px rgba(58,142,255,.6);animation:glow 3s infinite alternate;}
.photo-box img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
@keyframes glow{from{box-shadow:0 0 25px #267cff;}to{box-shadow:0 0 60px #914cff;}}
#birthdayPage{display:none;min-height:100vh;padding:70px 20px;animation:reveal 1.5s ease;}
@keyframes reveal{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.birthday{max-width:1050px;margin:auto;text-align:center;}
.birthday h2{font-size:17px;letter-spacing:8px;color:#b8c4d6;}
.name{font-size:65px;margin:15px 0;color:#5cbcff;text-shadow:0 0 25px #258cff;}
.date{display:inline-block;padding:12px 25px;border:1px solid #297fd4;border-radius:30px;color:#70c5ff;margin-bottom:30px;}
.card{max-width:750px;margin:20px auto;padding:35px;border:1px solid rgba(67,155,255,.4);border-radius:20px;background:rgba(11,24,49,.7);box-shadow:0 0 30px rgba(27,104,220,.15);}
.card p{font-size:19px;line-height:1.9;color:#d8e0ec;}
.highlight{color:#5dbbff;font-weight:bold;}
.king{margin-top:20px;color:#6bc1ff;font-size:27px;}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;max-width:1000px;margin:45px auto;}
.feature{padding:25px 15px;border:1px solid rgba(72,135,255,.35);border-radius:15px;background:rgba(8,19,40,.8);}
.feature .icon{font-size:35px;}
.feature h3{margin:12px 0 8px;color:#6dc4ff;}
.feature p{color:#aab8ca;font-size:14px;line-height:1.5;}
.music-card{max-width:850px;margin:40px auto;padding:20px;border:1px solid #236dc4;border-radius:20px;background:#071226;display:flex;align-items:center;gap:20px;text-align:left;}
.music-image{width:80px;height:80px;border-radius:15px;overflow:hidden;border:1px solid #2e92ff;}
.music-image img{width:100%;height:100%;object-fit:cover;}
.music-info{flex:1;}
.music-info h3{color:#fff;margin-bottom:8px;}
.music-info p{color:#82bfff;margin-bottom:10px;}
.music-info audio{width:100%;}
.footer{margin-top:40px;color:#89a7c8;font-size:16px;}
.heart{color:#ff5d85;}
.confetti{position:fixed;width:10px;height:15px;top:-20px;z-index:999;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
@media(max-width:768px){.hero{flex-direction:column-reverse;text-align:center;}.hero-text{width:100%;}.hero h1{font-size:36px;}.photo-box{width:280px;height:280px;}.name{font-size:45px;}.features{grid-template-columns:repeat(2,1fr);}.music-card{flex-direction:column;text-align:center;}}
</style>
</head>
<body>
<div class="particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<section id="startScreen">
    <div class="hero">
        <div class="hero-text">
            <div class="small">FOR SOMEONE SPECIAL 💙</div>
            <h1>A <span class="blue">SPECIAL</span> DAY <br> FOR A <span class="blue">SPECIAL</span> PERSON</h1>
